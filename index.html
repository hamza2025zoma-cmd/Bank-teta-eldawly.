<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنك تيته امال الدولي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--t:#fff;--t2:rgba(255,255,255,.7);--g:rgba(255,255,255,.14);--gb:rgba(255,255,255,.35);--bg1:#1b1464;--bg2:#0b6e8a;--ok:#7dffb2;--no:#ff8a9b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;font-family:'Cairo',system-ui,sans-serif;color:var(--t);background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.7;z-index:0;pointer-events:none}
.b1{width:320px;height:320px;background:#ff5fa2;top:-80px;right:-60px}
.b2{width:360px;height:360px;background:#ffb84d;bottom:-120px;left:-80px}
.b3{width:260px;height:260px;background:#5f8bff;top:45%;left:30%}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 14px 40px}
.glass{background:var(--g);border:1px solid var(--gb);border-radius:26px;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(0,0,0,.2);padding:18px;margin-bottom:14px}
h1{margin:0;font-size:26px;font-weight:800;text-align:center}
.sub{text-align:center;color:var(--t2);margin:2px 0 16px;font-size:14px}
h2{margin:0 0 10px;font-size:18px}
input,select{width:100%;padding:12px 14px;margin:5px 0;border-radius:16px;border:1px solid var(--gb);background:rgba(255,255,255,.12);color:var(--t);font:inherit;outline:none}
select option{color:#111}
input::placeholder{color:var(--t2)}
button{font:inherit;font-weight:600;color:var(--t);padding:11px 16px;border-radius:16px;border:1px solid var(--gb);background:rgba(255,255,255,.22);cursor:pointer;backdrop-filter:blur(10px)}
button:active{transform:scale(.97)}
.main{width:100%;margin-top:6px;background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.15))}
.danger{color:var(--no)}
.bal{font-size:40px;font-weight:800;text-align:center;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.row:last-child{border:0}
.sm{font-size:13px;color:var(--t2)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acts button{padding:7px 11px;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.msg{text-align:center;margin:8px 0;min-height:22px;font-size:14px}
.in{color:var(--ok)}.out{color:var(--no)}

.wheel-card{border:1px solid rgba(255,255,255,.5);background:linear-gradient(135deg,rgba(255,196,77,.25),rgba(255,95,162,.2))}
.wheel-badge{display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px}
.wheel-result{padding:14px;border-radius:18px;background:rgba(0,0,0,.16);margin:10px 0;text-align:center}
.wheel-result strong{display:block;font-size:19px;line-height:1.7}
.wheel-reward{font-size:25px;font-weight:800;color:#ffe58a}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
<h1 id="ttl" style="user-select:none">🏦 بنك تيته امال الدولي</h1>
<div class="sub">بنك العيلة · الحد الأقصى 10 حسابات</div>
<div id="app"><div class="glass msg">جاري التحميل...</div></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const ADMIN_NAME="Hamza",ADMIN_PASS="Hamza@1612",MAX=10;
const S={accs:[],tx:[],me:null,admin:false,msg:"",ok:true,ready:false,sel:"",showAdmin:location.hash==="#admin",wheelConfig:{price:2000,challenges:[]}};
let taps=0,tapT=null;
let db=null;
try{S.me=sessionStorage.getItem("bk_me")||null;S.admin=sessionStorage.getItem("bk_admin")==="1"}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("en-US");
const save=()=>{try{S.me?sessionStorage.setItem("bk_me",S.me):sessionStorage.removeItem("bk_me");sessionStorage.setItem("bk_admin",S.admin?"1":"0")}catch(e){}};
const say=(m,ok=true)=>{S.msg=m;S.ok=ok;render()};
const byId=id=>S.accs.find(a=>a.id===id);
const byName=n=>S.accs.find(a=>a.name.trim().toLowerCase()===n.trim().toLowerCase());
const val=id=>($("#"+id)||{}).value||"";

function render(){
  if(!S.ready)return;
  if(document.activeElement&&document.activeElement.tagName==="INPUT"){return}
  const m=`<div class="msg" style="color:${S.ok?'var(--ok)':'var(--no)'}">${esc(S.msg)}</div>`;
  const me=S.me?byId(S.me):null;
  if(S.me&&!me&&!S.admin){S.me=null;save()}
  let h="";
  if(S.admin)h=adminView(m);
  else if(me)h=userView(me,m);
  else h=loginView(m);
  $("#app").innerHTML=h;
}
function loginFields(){
  const x=byId(S.sel);if(!x)return "";
  const hz=x.name.trim().toLowerCase()==="hamza";
  if(hz||x.pin)return `<input id="lg-pin" type="password" placeholder="ادخل كلمة السر" autocapitalize="off" autocorrect="off" spellcheck="false">`;
  return `<div class="sm">أول مرة؟ اعمل كلمة سر لحسابك</div><input id="lg-pin" type="password" placeholder="كلمة السر الجديدة"><input id="lg-pin2" type="password" placeholder="أكّد كلمة السر">`;
}
function loginView(m){
  const opts=S.accs.map(a=>`<option value="${a.id}"${S.sel===a.id?" selected":""}>${esc(a.name)}</option>`).join("");
  return `<div class="glass"><h2>دخول حساب</h2>
  <select id="lg-acc"><option value="">اختار اسمك</option>${opts}</select>
  ${loginFields()}
  <button class="main" data-act="login">دخول</button></div>
  ${S.showAdmin?`<div class="glass"><h2>دخول الأدمن</h2>
  <input id="ad-n" placeholder="اسم الأدمن" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <input id="ad-p" type="password" placeholder="الباسورد" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="main" data-act="adlogin">دخول كأدمن</button></div>`:""}${m}`;
}
function txList(filterId){
  const l=S.tx.filter(t=>!filterId||t.fromId===filterId||t.toId===filterId).slice(0,12);
  if(!l.length)return `<div class="sm">مفيش عمليات لسه</div>`;
  return l.map(t=>{
    const inn=filterId&&t.toId===filterId;
    const title=filterId?(inn?`وصلك تحويل من ${t.from}`:`حوّلت إلى ${t.to}`):`${t.from} حوّل إلى ${t.to}`;
    const reason=t.note?`السبب: ${t.note}`:"";
    const when=t.t?new Date(t.t).toLocaleString("ar-EG"):"";
    return `<div class="row"><div><b>${esc(title)}</b><div class="sm">${reason?esc(reason):""}</div><div class="sm">${esc(when)}</div></div><b class="${filterId?(inn?'in':'out'):''}">${filterId?(inn?'+':'−'):''}${fmt(t.amt)} جنيه</b></div>`}).join("");
}
const CHALLENGES = [{"text": "قول لتيته زعلانة منك واطلب منها الصلح بجدية تمثيلية", "reward": 20000, "level": 5}, {"text": "اعمل إعلان تلفزيوني عن شبشب البيت لمدة 30 ثانية", "reward": 15000, "level": 5}, {"text": "غنّي أغنية أطفال بصوت أوبرالي", "reward": 14000, "level": 5}, {"text": "اتكلم بالفصحى لمدة 3 دقائق مهما كان الموضوع", "reward": 12000, "level": 4}, {"text": "قلّد مذيع نشرة أخبار وهو بيعلن عن اختفاء آخر قطعة كيك", "reward": 12000, "level": 4}, {"text": "اعمل خطاب شكر مؤثر لكرسيك المفضل", "reward": 11000, "level": 4}, {"text": "امشِ في البيت كأنك عارض أزياء لمدة دقيقة", "reward": 10000, "level": 4}, {"text": "احكي نكتة بصوت شخصية كرتونية", "reward": 9000, "level": 3}, {"text": "اعمل مشهد درامي عن ضياع فردة شراب", "reward": 10000, "level": 4}, {"text": "اتكلم لمدة دقيقتين من غير ما تقول كلمة «أنا»", "reward": 10000, "level": 4}, {"text": "قدّم نفسك كأنك مرشح لرئاسة كوكب المريخ", "reward": 11000, "level": 4}, {"text": "غنّي اسم 5 أكلات على لحن أغنية من اختيارك", "reward": 9000, "level": 3}, {"text": "اعمل مقابلة صحفية مع مخدة واسألها عن أحلامها", "reward": 12000, "level": 4}, {"text": "قلّد روبوت بيحاول يطلب بيتزا", "reward": 9000, "level": 3}, {"text": "امدح معلقة كأنها أعظم اختراع في التاريخ", "reward": 8000, "level": 3}, {"text": "اعمل تعليق رياضي على شخص بيشرب مية", "reward": 9000, "level": 3}, {"text": "اتكلم ببطء شديد لمدة دقيقة كاملة", "reward": 7000, "level": 2}, {"text": "قول جملة «أنا أسطورة البطاطس» بثلاث مشاعر مختلفة", "reward": 7000, "level": 2}, {"text": "اعمل رقصة انتصار من اختراعك لمدة 20 ثانية", "reward": 10000, "level": 4}, {"text": "مثّل إنك بتقدم جائزة الأوسكار لأفضل طبق في البيت", "reward": 11000, "level": 4}, {"text": "احكي قصة قصيرة بطلها حبة طماطم", "reward": 8000, "level": 3}, {"text": "قلّد صوت 4 حيوانات وخلي اللي حواليك يخمنوا", "reward": 9000, "level": 3}, {"text": "اعمل إعلان عن قلم كأنه أغلى موبايل في العالم", "reward": 10000, "level": 4}, {"text": "اتكلم كأنك مذيع راديو لمدة دقيقتين", "reward": 8000, "level": 3}, {"text": "قول 5 مجاملات لطيفة لأفراد أسرتك", "reward": 6000, "level": 2}, {"text": "اعمل مشهد اعتذار درامي لنبتة أو لعبة", "reward": 9000, "level": 3}, {"text": "قدّم نشرة جوية عن حالة الطقس داخل المطبخ", "reward": 8000, "level": 3}, {"text": "مثّل إنك بتشرح اختراع عجيب في مؤتمر عالمي", "reward": 11000, "level": 4}, {"text": "اقرأ آخر رسالة عادية كتبتها بصوت مذيع وثائقي، بعد موافقة صاحبها", "reward": 10000, "level": 4}, {"text": "اعمل تحدي عدم الضحك لمدة دقيقة والآخرون يحاولوا يضحكوك", "reward": 9000, "level": 3}, {"text": "اختر لقبًا مضحكًا لنفسك واستخدمه لمدة 10 دقائق", "reward": 7000, "level": 2}, {"text": "اتكلم كأنك ملك في فيلم تاريخي لمدة دقيقتين", "reward": 9000, "level": 3}, {"text": "اعمل مراجعة سينمائية لكوباية شاي", "reward": 8000, "level": 3}, {"text": "مثّل إنك بتبيع هواء معبأ في زجاجة", "reward": 10000, "level": 4}, {"text": "قول جملة صعبة 3 مرات بسرعة من غير لخبطه", "reward": 7000, "level": 2}, {"text": "اعمل حوار بينك وبين فردة شبشب", "reward": 8000, "level": 3}, {"text": "قدّم فقرة مواهب لمدة 30 ثانية", "reward": 9000, "level": 3}, {"text": "اخترع أغنية من 4 سطور عن المذاكرة", "reward": 10000, "level": 4}, {"text": "اعمل مشية بطيئة جدًا كأنك داخل نهائي بطولة", "reward": 9000, "level": 3}, {"text": "صف نفسك كأنك منتج جديد في إعلان", "reward": 8000, "level": 3}, {"text": "اتكلم لمدة دقيقة من غير استخدام حرف الميم", "reward": 12000, "level": 4}, {"text": "اعمل تمثيلية صامتة عن واحد نسي هو داخل الأوضة ليه", "reward": 9000, "level": 3}, {"text": "قلّد طريقة مذيع بيقدم برنامج مسابقات", "reward": 8000, "level": 3}, {"text": "اعمل خطاب تحفيزي لطبق فاضي", "reward": 9000, "level": 3}, {"text": "احكي موقفًا يوميًا عاديًا كأنه فيلم أكشن كوميدي", "reward": 11000, "level": 4}, {"text": "اخترع تحية رسمية خاصة بيك ونفذها قدام الموجودين", "reward": 7000, "level": 2}, {"text": "اعمل إعلان سياحي عن الصالة في البيت", "reward": 8000, "level": 3}, {"text": "قول اسمك و3 صفات فيك كأنك بتقدم شخصية خارقة", "reward": 6000, "level": 2}, {"text": "غنّي جملة «فين الريموت؟» بثلاثة ألحان مختلفة", "reward": 7000, "level": 2}, {"text": "اعمل اعتذار رسمي للجمهور لأنك أكلت آخر قطعة بسكويت (لو حصل)", "reward": 10000, "level": 4}];

function wheelBox(me){
  const pending=me.pendingWheel;
  const cfg=S.wheelConfig||{price:2000,challenges:CHALLENGES};
  const wheelPrice=Math.max(0,Number(cfg.price)||0);
  if(pending){
    return `<div class="glass wheel-card"><div class="top"><b>🎡 تحديّك الحالي</b><span class="wheel-badge">المستوى ${pending.level}/5</span></div>
      <div class="wheel-result"><div class="sm">التحدي اللي كسبته</div><strong>${esc(pending.text)}</strong>
      <div class="wheel-reward">+${fmt(pending.reward)} جنيه</div></div>
      <div class="sm">نفّذ التحدي، وبعدها اضغط تأكيد استلام المكافأة.</div>
      <button class="main" data-act="wheelclaim">✅ خلصت التحدي واستلم المكافأة</button></div>`;
  }
  return `<div class="glass wheel-card"><div class="top"><b>🎡 عجلة الحظ والتحديات</b><span class="wheel-badge">50 تحدي</span></div>
    <div class="sm">كل لفة بـ ${fmt(wheelPrice)} جنيه. نفّذ التحدي عشان تستلم مكافأته.</div>
    <div class="wheel-result"><div style="font-size:42px">🎯 🎲 🎡</div><strong>مستعد للمغامرة؟</strong><div class="sm">${(cfg.challenges||CHALLENGES).length} تحدي متاح</div></div>
    <button class="main" data-act="wheelspin">لف العجلة بـ ${fmt(wheelPrice)} جنيه 🎡</button></div>`;
}

function userView(me,m){
  const others=S.accs.filter(a=>a.id!==me.id).map(a=>`<option>${esc(a.name)}</option>`).join("");
  return `<div class="glass"><div class="top"><b>أهلاً ${esc(me.name)} 👋</b><button data-act="logout">خروج</button></div>
  <div class="sm" style="text-align:center">رصيدك</div><div class="bal">${fmt(me.balance)} 💰</div></div>
  <div class="glass"><h2>تحويل فلوس</h2>
  <input id="tr-n" list="names" placeholder="اسم المستلم"><datalist id="names">${others}</datalist>
  <input id="tr-a" type="number" inputmode="numeric" min="1" placeholder="المبلغ">
  <input id="tr-reason" maxlength="120" placeholder="سبب التحويل (مثال: تمن اللعبة كدا)">
  <button class="main" data-act="transfer">حوّل</button>${m}</div>
  ${wheelBox(me)}<div class="glass"><h2>عملياتي</h2>${txList(me.id)}</div>`;
}
function wheelAdminEditor(){
  const cfg=S.wheelConfig||{price:2000,challenges:CHALLENGES};
  const list=(cfg.challenges&&cfg.challenges.length?cfg.challenges:CHALLENGES);
  return `<div class="glass wheel-card"><h2>🎡 إنشاء / تعديل عجلة حظ</h2>
    <div class="sm">اكتب كل تحدي ومكافأته، وبعد ما تخلص حدّد سعر اللفة واحفظ العجلة.</div>
    <div id="wheel-edit-rows">${list.map((c,i)=>`<div class="wheel-edit-row" style="border:1px solid var(--gb);border-radius:16px;padding:10px;margin:9px 0">
      <div class="sm">التحدي ${i+1}</div><input class="wheel-challenge-text" value="${esc(c.text)}" placeholder="اكتب التحدي">
      <input class="wheel-challenge-reward" type="number" min="1" value="${Number(c.reward)||0}" placeholder="المكافأة بالجنيه">
      <input class="wheel-challenge-level" type="number" min="1" max="5" value="${Number(c.level)||3}" placeholder="مستوى الصعوبة من 1 إلى 5">
      <button type="button" data-act="wheelRemoveRow">حذف التحدي</button></div>`).join("")}</div>
    <button type="button" data-act="wheelAddRow">➕ إضافة خانة تحدي</button>
    <hr style="border-color:var(--gb);margin:16px 0">
    <label for="wheel-price"><b>سعر العجلة بالجنيه</b></label><input id="wheel-price" type="number" min="0" value="${Number(cfg.price??2000)}" placeholder="سعر اللفة">
    <button class="main" data-act="wheelSave">💾 حفظ العجلة ونشرها للحسابات</button>
  </div>`;
}
function addWheelEditorRow(){
  const box=$("#wheel-edit-rows");if(!box)return;
  const n=box.querySelectorAll(".wheel-edit-row").length+1;
  const d=document.createElement("div");d.className="wheel-edit-row";d.style.cssText="border:1px solid var(--gb);border-radius:16px;padding:10px;margin:9px 0";
  d.innerHTML=`<div class="sm">التحدي ${n}</div><input class="wheel-challenge-text" placeholder="اكتب التحدي"><input class="wheel-challenge-reward" type="number" min="1" placeholder="المكافأة بالجنيه"><input class="wheel-challenge-level" type="number" min="1" max="5" value="3" placeholder="مستوى الصعوبة من 1 إلى 5"><button type="button" data-act="wheelRemoveRow">حذف التحدي</button>`;
  box.appendChild(d);
}
function adminView(m){
  const rows=S.accs.map(a=>`<div class="row" style="flex-direction:column;align-items:stretch">
   <div style="display:flex;justify-content:space-between"><b>${esc(a.name)}</b><b>${fmt(a.balance)}</b></div>
   <div class="sm">${a.pin?"كلمة السر: "+esc(a.pin):"من غير كلمة سر"}</div>

  <div class="glass"><h2>المحافظ</h2>${rows||'<div class="sm">مفيش حسابات لسه</div>'}</div>
  <div class="glass"><h2>كل العمليات</h2>${txList(null)}</div>`;

async function logTx(from,to,amt,note){
  const id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  await db.collection("tx").doc(id).set({from:from.name,fromId:from.id,to:to.name,toId:to.id,amt,note:note||"",t:Date.now()});
}
const ADM={id:"admin",name:"البنك"};
let eventTarget=null;
async function act(a,id){
  try{
    if(a==="login"){const x=byId(val("lg-acc"));if(!x)return say("اختار اسمك",false);const p=val("lg-pin").trim();if(x.name.trim().toLowerCase()==="hamza"){if(p!==ADMIN_PASS)return say("الباسورد غلط",false);S.admin=true;S.me=null;save();S.msg="";return render()}if(x.pin){if(x.pin!==p)return say("كلمة السر غلط",false)}else{if(p.length<3)return say("اكتب كلمة سر (3 حروف على الأقل)",false);if(p!==val("lg-pin2").trim())return say("كلمتين السر مش زي بعض",false);await db.collection("accounts").doc(x.id).update({pin:p})}S.me=x.id;S.admin=false;save();S.msg="";return render()}
    if(a==="adlogin"){if(val("ad-n").trim().toLowerCase()!==ADMIN_NAME.toLowerCase()||val("ad-p").trim()!==ADMIN_PASS)return say("بيانات الأدمن غلط",false);S.admin=true;S.me=null;save();S.msg="";return render()}
    if(a==="logout"){S.me=null;S.admin=false;save();S.msg="";return render()}
    if(a==="create"){
      const name=val("n-name").trim(),pin=val("n-pin").trim(),bal=val("n-bal").trim()===""?10000:Math.max(0,Math.floor(Number(val("n-bal"))||0));
      if(!name)return say("اكتب الاسم",false);
      if(S.accs.length>=MAX)return say("وصلنا للحد الأقصى 10 حسابات",false);
      if(byName(name))return say("الاسم ده موجود بالفعل",false);
      const id="a"+Date.now().toString(36);
      await db.collection("accounts").doc(id).set({name,pin,balance:bal,t:Date.now()});
      return say("تم إنشاء حساب "+name+" ✅");
    }
    const x=byId(id);
    if(a==="clr"){await db.collection("accounts").doc(id).update({pin:""});return say("اتمسحت كلمة سر "+x.name+" ✅")}
    if(a==="del"){if(!x||!confirm("تحذف حساب "+x.name+"؟"))return;await db.collection("accounts").doc(id).delete();return say("تم الحذف")}
    if(a==="add"||a==="sub"||a==="set"){
      const v=Math.floor(Number(val("v-"+id)));if(!(v>=0)||isNaN(v))return say("اكتب مبلغ صحيح",false);
      let nb=a==="add"?x.balance+v:a==="sub"?Math.max(0,x.balance-v):v;
      await db.collection("accounts").doc(id).update({balance:nb});
      if(a==="add")await logTx(ADM,x,v,"إيداع من الأدمن");
      if(a==="sub")await logTx(x,ADM,Math.min(v,x.balance),"سحب بواسطة الأدمن");
      return say("تم تعديل رصيد "+x.name+" ✅");
    }

    if(a==="wheelAddRow"){addWheelEditorRow();return}
    if(a==="wheelRemoveRow"){const row=eventTarget.closest(".wheel-edit-row");if(row)row.remove();return}
    if(a==="wheelSave"){
      const price=Math.floor(Number(val("wheel-price")));
      if(!(price>=0))return say("اكتب سعر لفة صحيح",false);
      const rows=[...document.querySelectorAll("#wheel-edit-rows .wheel-edit-row")];
      const challenges=[];
      for(const row of rows){
        const text=row.querySelector(".wheel-challenge-text").value.trim();
        const reward=Math.floor(Number(row.querySelector(".wheel-challenge-reward").value));
        const level=Math.min(5,Math.max(1,Math.floor(Number(row.querySelector(".wheel-challenge-level").value)||3)));
        if(!text&&!row.querySelector(".wheel-challenge-reward").value)continue;
        if(!text||!(reward>0))return say("كل تحدي لازم يكون له نص ومكافأة أكبر من صفر",false);
        challenges.push({text,reward,level});
      }
      if(!challenges.length)return say("ضيف تحدي واحد على الأقل",false);
      await db.collection("settings").doc("wheel").set({price,challenges,updatedAt:Date.now()});
      S.wheelConfig={price,challenges};return say("تم حفظ العجلة وتحديثها لكل الحسابات 🎡");
    }
    if(a==="wheelspin"){
      const me=byId(S.me);
      const cfg=S.wheelConfig||{price:2000,challenges:CHALLENGES};
      const wheelPrice=Math.max(0,Number(cfg.price)||0);
      const challengeList=cfg.challenges&&cfg.challenges.length?cfg.challenges:CHALLENGES;
      if(me.pendingWheel)return say("عندك تحدي شغال بالفعل، خلّصه الأول 🎯",false);
      const fresh=(await db.collection("accounts").doc(me.id).get()).data();
      if(!fresh||Number(fresh.balance||0)<wheelPrice)return say("رصيدك مش كفاية للفة. محتاج "+fmt(wheelPrice)+" جنيه.",false);
      const c=challengeList[Math.floor(Math.random()*challengeList.length)];
      const pending={...c,id:"w"+Date.now().toString(36),createdAt:Date.now()};
      await db.collection("accounts").doc(me.id).update({balance:Number(fresh.balance)-wheelPrice,pendingWheel:pending});
      await logTx(me,ADM,wheelPrice,"رسوم لف عجلة التحديات");
      return say("العجلة اختارتلك تحدي! نفّذه عشان تستلم المكافأة 🎉");
    }
    if(a==="wheelclaim"){
      const me=byId(S.me);
      const ref=db.collection("accounts").doc(me.id);
      const fresh=(await ref.get()).data();
      const pending=fresh&&fresh.pendingWheel;
      if(!pending)return say("مفيش تحدي مستني التأكيد.",false);
      await ref.update({balance:Number(fresh.balance||0)+Number(pending.reward||0),pendingWheel:null});
      await logTx(ADM,me,Number(pending.reward||0),"مكافأة تحدي العجلة: "+pending.text);
      return say("مبروك! اتضافت "+fmt(pending.reward)+" جنيه لرصيدك 🏆");
    }
    if(a==="transfer"){
      const me=byId(S.me),to=byName(val("tr-n")),amt=Math.floor(Number(val("tr-a"))),reason=val("tr-reason").trim();
      if(!to)return say("مفيش حساب بالاسم ده",false);
      if(to.id===me.id)return say("مينفعش تحوّل لنفسك",false);
      if(!(amt>0))return say("اكتب مبلغ صحيح",false);
      if(!reason)return say("اكتب سبب التحويل عشان يظهر للمستلم",false);
      const fresh=(await db.collection("accounts").doc(me.id).get()).data();
      if(!fresh||fresh.balance<amt)return say("رصيدك مش كفاية",false);
            const FV=firebase.firestore.FieldValue;const batch=db.batch();
      batch.update(db.collection("accounts").doc(me.id),{balance:FV.increment(-amt)});
      batch.update(db.collection("accounts").doc(to.id),{balance:FV.increment(amt)});
      await batch.commit();
      await logTx(me,to,amt,reason);
      return say("تم تحويل "+fmt(amt)+" جنيه إلى "+to.name+" بسبب: "+reason+" ✅");
    }
  }catch(e){say("حصلت مشكلة: "+(e&&e.message||e),false)}
}
document.addEventListener("click",e=>{if(e.target.closest("#ttl")){taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,2000);if(taps>=5){taps=0;S.showAdmin=true;render()}}const b=e.target.closest("[data-act]");if(b){eventTarget=b;act(b.dataset.act,b.dataset.id)}});
document.addEventListener("change",e=>{if(e.target.id==="lg-acc"){S.sel=e.target.value;S.msg="";render()}});
window.addEventListener("hashchange",()=>{S.showAdmin=location.hash==="#admin";render()});
document.addEventListener("focusout",()=>setTimeout(render,150));

const showFatal=m=>{$("#app").innerHTML='<div class="glass msg" style="color:var(--no)">'+esc(m)+'<br><br><button id="s-reset">إعادة الإعداد</button></div>';const r=$("#s-reset");if(r)r.onclick=()=>{localStorage.removeItem("fb_cfg");location.reload()}};
const FAMILY=["Hamza","Omar","Farah","Malak","Rana","Ahmed"];
(async()=>{
  try{
    if(typeof firebase==="undefined")throw new Error("مكتبة Firebase ماتحملتش. اتأكد من النت أو من إن الملف متفتحش بحاجة بتحجب gstatic.com");
    if(!firebaseConfig){setupForm();return}
    firebase.initializeApp(firebaseConfig);
    db=firebase.firestore();
    const ws=await db.collection("settings").doc("wheel").get();
    const sw=ws.exists?ws.data():null;
    if(sw&&Array.isArray(sw.challenges)&&sw.challenges.length)S.wheelConfig={price:Number(sw.price)||0,challenges:sw.challenges};
    else S.wheelConfig={price:2000,challenges:CHALLENGES};
    let seeded=false;
    db.collection("accounts").onSnapshot(snap=>{
      if(snap.empty&&!seeded){
        seeded=true;
        FAMILY.forEach((name,i)=>db.collection("accounts").doc("family_"+name.toLowerCase()).set({name,pin:"",balance:0,t:Date.now()+i}).catch(e=>showFatal("مش قادر أكتب في Firestore: "+e.message)));
      }
      S.accs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.t||0)-(b.t||0));
      S.ready=true;render();
    },e=>showFatal("خطأ في تحميل الحسابات: "+e.message+" — غالباً قواعد Firestore (Rules) بتمنع القراءة"));
    db.collection("tx").onSnapshot(snap=>{
      S.tx=snap.docs.map(d=>d.data()).sort((a,b)=>b.t-a.t);render();
    },e=>console.error("tx:",e));
  }catch(e){showFatal("تعذر تشغيل البنك: "+(e&&e.message||e));}
})();
</script>
